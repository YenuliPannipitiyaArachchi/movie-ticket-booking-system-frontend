<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stellar Drift poster</title>
  <desc id="desc">Space poster with a drifting ship silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="55%" stop-color="#10284f" />
      <stop offset="100%" stop-color="#1c5164" />
    </linearGradient>
    <radialGradient id="planet" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#91e8ff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#91e8ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#91e8ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="230" r="220" fill="url(#planet)" />
  <circle cx="120" cy="160" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="470" cy="180" r="4" fill="#ffffff" opacity="0.85" />
  <circle cx="510" cy="300" r="2" fill="#ffffff" opacity="0.7" />
  <path d="M150 620 L300 520 L450 620 L300 670 Z" fill="#d4edf7" opacity="0.9" />
  <path d="M300 520 L332 585 L300 670 L268 585 Z" fill="#72cbe2" opacity="0.9" />
  <text x="300" y="370" text-anchor="middle" fill="#d4edf7" font-family="Georgia, serif" font-size="64" font-weight="700">Stellar Drift</text>
  <text x="300" y="436" text-anchor="middle" fill="#d4edf7" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">SCI-FI</text>
  <text x="300" y="720" text-anchor="middle" fill="#d4edf7" font-family="Arial, sans-serif" font-size="18" opacity="0.85">A silent ship in deep space.</text>
</svg>
