<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monsoon Road poster</title>
  <desc id="desc">Warm drama poster with rainy road stripes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1727" />
      <stop offset="55%" stop-color="#5a2d2d" />
      <stop offset="100%" stop-color="#d47d33" />
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efe6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f6efe6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <path d="M40 700 C160 600, 240 570, 300 580 C360 590, 440 640, 560 540" fill="none" stroke="#f6efe6" stroke-width="12" opacity="0.32" />
  <path d="M140 140 L100 220" stroke="url(#rain)" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <path d="M220 120 L180 210" stroke="url(#rain)" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  <path d="M420 150 L380 240" stroke="url(#rain)" stroke-width="10" stroke-linecap="round" opacity="0.75" />
  <path d="M500 110 L470 200" stroke="url(#rain)" stroke-width="10" stroke-linecap="round" opacity="0.65" />
  <text x="300" y="370" text-anchor="middle" fill="#fff2d8" font-family="Georgia, serif" font-size="64" font-weight="700">Monsoon Road</text>
  <text x="300" y="436" text-anchor="middle" fill="#fff2d8" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">DRAMA</text>
  <text x="300" y="720" text-anchor="middle" fill="#fff2d8" font-family="Arial, sans-serif" font-size="18" opacity="0.85">A long ride across the island.</text>
</svg>
