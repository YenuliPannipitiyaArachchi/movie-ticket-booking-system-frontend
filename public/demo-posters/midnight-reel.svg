<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Midnight Reel poster</title>
  <desc id="desc">Dark thriller poster with a cinematic reel motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c17" />
      <stop offset="60%" stop-color="#25122d" />
      <stop offset="100%" stop-color="#0c2a33" />
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f6d76d" stop-opacity="1" />
      <stop offset="70%" stop-color="#f6d76d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f6d76d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="250" r="220" fill="url(#moon)" />
  <path d="M120 620 C190 560, 240 520, 300 540 C360 560, 410 610, 480 575" fill="none" stroke="#f6d76d" stroke-width="10" stroke-linecap="round" opacity="0.75" />
  <circle cx="180" cy="250" r="18" fill="#f6d76d" opacity="0.8" />
  <circle cx="420" cy="195" r="9" fill="#f6d76d" opacity="0.85" />
  <text x="300" y="365" text-anchor="middle" fill="#f6d76d" font-family="Georgia, serif" font-size="64" font-weight="700">Midnight Reel</text>
  <text x="300" y="430" text-anchor="middle" fill="#f3efe7" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">THRILLER</text>
  <text x="300" y="720" text-anchor="middle" fill="#f3efe7" font-family="Arial, sans-serif" font-size="18" opacity="0.8">A film that predicts tomorrow.</text>
</svg>
