<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Movie poster placeholder</title>
  <desc id="desc">Stylized demo movie poster with a cinematic gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19111f" />
      <stop offset="55%" stop-color="#3a1f3c" />
      <stop offset="100%" stop-color="#0c2d3c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5d96b" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f5d96b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f5d96b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="240" r="210" fill="url(#glow)" />
  <path d="M60 760 L540 760" stroke="#f5d96b" stroke-width="4" stroke-opacity="0.5" />
  <text x="300" y="350" text-anchor="middle" fill="#f5d96b" font-family="Georgia, serif" font-size="56" font-weight="700">Demo Movie</text>
  <text x="300" y="410" text-anchor="middle" fill="#f3efe7" font-family="Arial, sans-serif" font-size="22" letter-spacing="5">CINEMA NIGHT</text>
  <text x="300" y="720" text-anchor="middle" fill="#f3efe7" font-family="Arial, sans-serif" font-size="18" opacity="0.85">Poster unavailable</text>
</svg>
