<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Paper Lanterns poster</title>
  <desc id="desc">Animated poster with glowing lanterns floating at night.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20121a" />
      <stop offset="50%" stop-color="#5a2440" />
      <stop offset="100%" stop-color="#d97738" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe07a" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffe07a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffe07a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="240" r="220" fill="url(#glow)" />
  <ellipse cx="210" cy="250" rx="34" ry="46" fill="#ffe07a" opacity="0.95" />
  <ellipse cx="310" cy="200" rx="28" ry="40" fill="#ffb347" opacity="0.9" />
  <ellipse cx="410" cy="270" rx="30" ry="44" fill="#ffd166" opacity="0.88" />
  <text x="300" y="370" text-anchor="middle" fill="#fff3cc" font-family="Georgia, serif" font-size="58" font-weight="700">Paper Lanterns</text>
  <text x="300" y="436" text-anchor="middle" fill="#fff3cc" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">COMING SOON</text>
  <text x="300" y="720" text-anchor="middle" fill="#fff3cc" font-family="Arial, sans-serif" font-size="18" opacity="0.88">A festival night, a lost lantern.</text>
</svg>
